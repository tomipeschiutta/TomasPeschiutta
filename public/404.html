<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Tomás Peschiutta</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="icon" href="./assets/images/favicon.png" type="image/png">
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('tp-theme') === 'light' ? 'light' : 'dark';
    </script>
    <style>
        .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
        .nf__code { font-family: var(--font-mono); font-size: clamp(4rem, 18vw, 9rem); line-height: 1;
                    background: linear-gradient(120deg, var(--accent), var(--accent-2));
                    -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nf p { color: var(--text-muted); margin: 1rem 0 2rem; }
    </style>
</head>
<body>
    <main class="nf">
        <div>
            <p class="nf__code">404</p>
            <h1>Esta página no existe</h1>
            <p>El enlace que seguiste no lleva a ningún lado.</p>
            <a href="/" class="btn btn--primary">Volver al inicio</a>
        </div>
    </main>
</body>
</html>
